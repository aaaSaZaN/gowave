name: Dev build

# Eligible pushes to main that pass CI become the dev channel:
#   - the rolling "dev" pre-release (releases/download/dev/...), recreated on each
#     build so it stays on top of the Releases page; releases/latest and the
#     stable updater never see it;
#   - Docker tags ghcr.io/<owner>/gowave:dev and :dev-<sha>; "latest" is untouched.
# Pushed commits with a v* tag go through release.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a build that has not been published yet.
concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      short: ${{ steps.v.outputs.short }}
      version-tagged: ${{ steps.tags.outputs.version-tagged }}
    steps:
      # A push of both main and a tag can also produce a main-branch event.
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@v7

      - name: Check for a version tag on the pushed commit
        id: tags
        if: github.event_name == 'push'
        run: |
          tags="$(git ls-remote --tags origin 'refs/tags/v*')"
          tagged="$(awk -v sha="$GITHUB_SHA" '$1 == sha { found = 1 } END { print found ? "true" : "false" }' <<< "$tags")"
          echo "version-tagged=$tagged" >> "$GITHUB_OUTPUT"

      - id: v
        run: |
          short="${GITHUB_SHA::7}"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "version=dev-$short" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: meta
    if: needs.meta.outputs.version-tagged != 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build dev release assets
    needs: [ci, meta]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      source-sha: ${{ github.sha }}
      channel: dev

  release:
    name: Publish dev pre-release
    needs: [build, meta]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Verify checksums
        run: sha256sum -c SHA256SUMS

      # The release name carries the build version: the panel compares it with
      # its own version to offer dev updates.
      - name: Replace the dev pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Unstable build of \`main\` at ${GITHUB_SHA}."
            echo
            echo "Install or switch to it from the panel (Build Info → dev) or with \`install.sh --dev\`. Docker: change the image tag in \`docker-compose.yml\` to \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gowave:dev\`."
            echo
            echo "### Latest commit"
            git log -1 --format='%s%n%n%b' "$GITHUB_SHA"
          } > notes.md
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            gowave-frontend.tar.gz gowave-linux-amd64 gowave-linux-arm64 SHA256SUMS

  docker:
    name: Publish dev Docker image
    needs: [ci, meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gowave" >> "$GITHUB_ENV"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=dev
            type=raw,value=dev-${{ needs.meta.outputs.short }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            TELEGRAM_CHAT_URL=${{ vars.TELEGRAM_CHAT_URL }}
            VERSION=${{ needs.meta.outputs.version }}
            CHANNEL=dev
            COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
