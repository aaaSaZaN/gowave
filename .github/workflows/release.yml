name: Release Gowave

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source-branch:
        required: true
        type: string
      source-sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      source-sha: ${{ inputs.source-sha || '' }}

  build:
    name: Build release assets
    needs: ci
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      source-sha: ${{ inputs.source-sha || github.sha }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release candidate commit
        if: inputs.source-branch != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-sha }}
          path: release-source

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Verify checksums
        run: sha256sum -c SHA256SUMS

      - name: Create GitHub Release
        if: inputs.source-branch == ''
        uses: softprops/action-gh-release@v3
        with:
          # v1.2.0-beta.1 becomes a pre-release, which releases/latest (and the updater) ignores
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            gowave-frontend.tar.gz
            gowave-linux-amd64
            gowave-linux-arm64
            SHA256SUMS
          generate_release_notes: true

      - name: Publish release candidate
        if: inputs.source-branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          SOURCE_BRANCH: ${{ inputs.source-branch }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          # A non-forced push rejects a conflicting tag and allows a retry at the same SHA.
          git -C release-source push origin "$SOURCE_SHA:refs/tags/$VERSION"

          printf 'Source branch\n\n    %s\n\nSource commit [%s](%s/%s/commit/%s)\n' \
            "$SOURCE_BRANCH" "$SOURCE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$SOURCE_SHA" > notes.md
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --target "$SOURCE_SHA" --prerelease --latest=false --title "$VERSION" \
            --generate-notes --notes-file notes.md \
            gowave-frontend.tar.gz gowave-linux-amd64 gowave-linux-arm64 SHA256SUMS

  docker:
    name: Publish Docker image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-sha || '' }}
          persist-credentials: false

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gowave" >> "$GITHUB_ENV"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest=auto skips pre-release versions such as v1.2.0-beta.1.
          # The dev channel has its own tags (dev, dev-<sha>) from dev.yml.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version || github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source-sha || github.sha }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            TELEGRAM_CHAT_URL=${{ vars.TELEGRAM_CHAT_URL }}
            VERSION=${{ inputs.version || github.ref_name }}
            COMMIT_SHA=${{ inputs.source-sha || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
