name: Release Gowave

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          tar -czf ../gowave-frontend.tar.gz -C dist .

      - name: Build Backend Binaries
        working-directory: ./backend-go
        run: |
          VERSION="${GITHUB_REF_NAME}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X 'gowave/internal/system.AppVersion=${VERSION}'" -o ../gowave-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X 'gowave/internal/system.AppVersion=${VERSION}'" -o ../gowave-linux-arm64 ./cmd/server

      - name: Verify embedded version
        run: |
          embedded="$(./gowave-linux-amd64 --version)"
          if [ "$embedded" != "${GITHUB_REF_NAME}" ]; then
            echo "Binary reports '${embedded}', expected '${GITHUB_REF_NAME}'; check the -X package path" >&2
            exit 1
          fi

      - name: Checksums
        run: sha256sum gowave-frontend.tar.gz gowave-linux-amd64 gowave-linux-arm64 > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # v1.2.0-beta.1 becomes a pre-release, which releases/latest (and the updater) ignores
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            gowave-frontend.tar.gz
            gowave-linux-amd64
            gowave-linux-arm64
            SHA256SUMS
          generate_release_notes: true

  docker:
    name: Publish Docker image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gowave" >> "$GITHUB_ENV"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest=auto skips pre-release versions such as v1.2.0-beta.1
          tags: |
            type=semver,pattern={{version}}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
