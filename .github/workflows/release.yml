name: Release Gowave

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend-go/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          tar -czf ../gowave-frontend.tar.gz -C dist .

      - name: Build Backend Binaries
        working-directory: ./backend-go
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../gowave-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../gowave-linux-arm64 ./cmd/server

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gowave-frontend.tar.gz
            gowave-linux-amd64
            gowave-linux-arm64
          generate_release_notes: true
